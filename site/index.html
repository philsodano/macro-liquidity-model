<style>
/* Layout: sticky top bar with as-of + data status; section rail on the left (a scrolling strip on phones);

:root {

  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;

  }
}

  --line: #30343a; --grid: #262a2f; --accent: #8fb6e8; --accent-ink: #0e1620; --rec: rgba(240, 239, 236, .06);

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .85rem; }

<script>

function route() {

  document.querySelectorAll("nav.rail a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + view ? "page" : "false"));
  const main = document.getElementById("main");
  main.innerHTML = "";

  try { sec.append(...VIEWS[view](S.snap).flat(Infinity).filter(Boolean)); }
  catch (e) { console.error(e); sec.append(h("p", { class: "empty" }, "This section could not be drawn: " + e.message)); }

}
