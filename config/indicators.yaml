- {<<: *fw, id: "ANFCI", name: "Adjusted financial conditions", short: "Financial conditions vs the economy", units: "index", section: "policy", signal: "leading", polarity: -1, release_lag_days: 5, what: "NFCI stripped of the economic cycle.", why: "Isolates conditions the economy alone does not explain."}
- {<<: *fd, id: "ECBDFR", name: "ECB deposit rate", short: "ECB policy rate", units: "%", section: "policy", signal: "lagging", polarity: -1, release_lag_days: 0, what: "Rate the ECB pays on bank deposits.", why: "Euro rate gap vs the US drives the dollar and capital flows."}
- {id: "BOE_RATE", source: "boe", source_id: "IUDBEDR", freq: "D", release_lag_days: 1, name: "Bank of England Bank Rate", short: "BoE policy rate", units: "%", section: "policy", signal: "lagging", polarity: -1, what: "Official Bank Rate.", why: "UK policy stance; matters for gilts and global duration."}
- {<<: *fm, id: "IRSTCI01JPM156N", name: "Japan call money rate", short: "BoJ policy rate (call rate)", units: "%", section: "policy", signal: "lagging", polarity: -1, release_lag_days: 30, what: "Japan overnight call rate (OECD).", why: "Higher Japanese rates can pull yen carry-trade money home."}

