- {<<: *fw, id: "WRESBAL", name: "Bank reserves at the Fed", short: "Bank reserves", units: "USD bn", scale: 0.001, section: "liquidity", pillar: "central_bank", role: "member", display_only: true, signal: "leading", polarity: 1, release_lag_days: 1, what: "Deposits banks hold at the Fed.", why: "The core of money-market liquidity; scarce reserves force funding stress."}
