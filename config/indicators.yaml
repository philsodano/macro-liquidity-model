# Indicator registry — every series the model uses, defined once.
#
# polarity: +1 = a rise supports liquidity / growth / risk assets; -1 = a rise is a headwind.
#           Inflation series: +1 = a rise means more inflation pressure.
# signal:   leading | coincident | lagging, relative to the business cycle.
# release_lag_days: typical days from the observation date (as the source stamps it) to publication.
# pillar/role: liquidity pillar membership. 'core' series drive the pillar's impulse; a source series may be
#           core in only one pillar (loader enforces). display_only members are shown but never counted.
# kind: fact (published data) | estimate (model-derived). source: derived = computed by the model, not fetched.

defaults:
  fd: &fd {source: fred, freq: D, release_lag_days: 1}
  fw: &fw {source: fred, freq: W, release_lag_days: 2}
  fm: &fm {source: fred, freq: M, release_lag_days: 40}
  fq: &fq {source: fred, freq: Q, release_lag_days: 120}
  tg: &tg {source: tiingo, freq: D, release_lag_days: 1, units: USD (adj. price), section: markets, signal: leading, polarity: 1}
  sec: &sec {source: sec, freq: Q, release_lag_days: 50, units: USD bn, scale: 1.0e-9, section: ai, pillar: ai_capex, role: member, signal: leading, polarity: 1}
  dv: &dv {source: derived, kind: estimate, release_lag_days: 0}

indicators:
# ───────────── Central bank policy ─────────────
- {<<: *fd, id: "DFF", name: "Effective fed funds rate", short: "Fed policy rate", units: "%", section: "policy", signal: "lagging", polarity: -1, what: "Overnight rate banks pay each other for reserves.", why: "The Fed's main policy lever; sets the floor for all borrowing costs."}
- {<<: *fd, id: "DFEDTARU", name: "Fed funds target (upper)", short: "Fed target ceiling", units: "%", section: "policy", signal: "lagging", polarity: -1, release_lag_days: 0, what: "Top of the FOMC target range.", why: "The official policy setting."}
- {<<: *fd, id: "IORB", name: "Interest on reserve balances", short: "Rate paid on bank reserves", units: "%", section: "policy", signal: "lagging", polarity: -1, release_lag_days: 0, what: "Rate the Fed pays banks on reserves.", why: "Compared with SOFR it shows whether reserves are scarce."}
- {<<: *fd, id: "SOFR", name: "Secured overnight financing rate", short: "Overnight repo rate", units: "%", section: "policy", signal: "coincident", polarity: -1, what: "Cost of overnight cash borrowing against Treasuries.", why: "SOFR rising above IORB signals reserves are getting scarce."}
- {<<: *fd, id: "DTB3", name: "3-month T-bill", short: "3-month bill yield", units: "%", section: "policy", signal: "leading", polarity: -1, what: "Yield on 3-month Treasury bills.", why: "Prices the next ~3 months of Fed policy."}
- {<<: *fd, id: "DTB6", name: "6-month T-bill", short: "6-month bill yield", units: "%", section: "policy", signal: "leading", polarity: -1, what: "Yield on 6-month Treasury bills.", why: "Prices expected policy 6 months out."}
- {<<: *fd, id: "DTB1YR", name: "1-year T-bill", short: "1-year bill yield", units: "%", section: "policy", signal: "leading", polarity: -1, what: "Yield on 1-year Treasury bills.", why: "Prices expected policy 12 months out."}
- {<<: *fd, id: "DGS2", name: "2-year Treasury yield", short: "2-year yield", units: "%", section: "policy", signal: "leading", polarity: -1, what: "Yield on 2-year Treasury notes.", why: "Market's best read of the Fed path over two years."}
- {<<: *fd, id: "DFII5", name: "5-year real yield (TIPS)", short: "5-year real yield", units: "%", section: "policy", signal: "leading", polarity: -1, what: "Inflation-adjusted 5-year yield.", why: "Real cost of money over the policy horizon."}
