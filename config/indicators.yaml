- {<<: *fd, id: "RRPONTSYD", name: "Overnight reverse repo", short: "Cash parked at the Fed (RRP)", units: "USD bn", section: "liquidity", pillar: "central_bank", role: "member", signal: "leading", polarity: -1, what: "Money funds' cash parked at the Fed overnight.", why: "Draining RRP released cash into markets in 2023–24; near zero it is no longer a buffer."}
