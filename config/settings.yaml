# Refresh cadence per source (days between fetches). Lower = fresher, more requests.
refresh_days:
  fred: 1
  treasury: 1
  nyfed: 1
  ecb: 7
  boe: 7
  bis: 7
  sec: 7
  tiingo: 1
  files: 7
  derived: 0
# Extra days after an expected release before a series counts as stale.
freshness_grace_days:
  D: 5
  W: 10
  M: 25
  Q: 45
history_start: "1985-01-01"
# Scenario model: priors (sum 100) and how strongly each evidence group moves bull vs bear (log-odds per score unit).
scenarios:
  priors: {base: 55, bull: 20, bear: 25}
  floor: 5
  cap: 80
  weights: {liquidity: 0.6, credit: 0.5, growth: 0.4, labour: 0.3, consumer: 0.3, inflation: 0.3, policy: 0.3, valuation: 0.3}
