# Refresh cadence per source (days between fetches). Lower = fresher, more requests.
refresh_days:
  fred: 1
  treasury: 1
  nyfed: 1
  ecb: 7
  boe: 7
  bis: 7
  sec: 7
  tiingo: 1
  files: 7
  derived: 0
  cftc: 1
  ofr: 7
  nyfedpd: 1
  finra: 7
# Extra days after an expected release before a series counts as stale.
freshness_grace_days:
  D: 5
  W: 10
  M: 25
  Q: 45
history_start: "1985-01-01"
# Scenario model: priors (sum 100) and how strongly each evidence group moves bull vs bear (log-odds per score unit).
scenarios:
  priors: {base: 55, bull: 20, bear: 25}
  floor: 5
  cap: 80
  weights: {liquidity: 0.6, credit: 0.5, growth: 0.4, labour: 0.3, consumer: 0.3, inflation: 0.3, policy: 0.3, valuation: 0.3, positioning: 0.3}
# FOMC decision days (second day of each meeting). Verify against federalreserve.gov each January.
fomc_decisions: ["2026-01-28", "2026-03-18", "2026-04-29", "2026-06-17", "2026-07-29", "2026-09-16", "2026-10-28", "2026-12-09"]
research:
  n_boot: 300
